# Marinara Memory Module — add this file LAST when starting Marinara.
# NODE_OPTIONS is replaced (not merged) by the last compose file, so this line repeats
# every patch from docker-compose.251.yml and adds the memory module at the end.
services:
  marinara:
    volumes:
      - ./memory-module:/app/memory-module:ro
    environment:
      NODE_OPTIONS: >-
        --require=/app/me-speedup.cjs
        --require=/app/gacha-standing-ko-runtime.cjs
        --require=/app/gacha-cg-runtime.cjs
        --require=/app/novelai-gacha-delay.cjs
        --require=/app/gf-customizer-runtime.cjs
        --require=/app/memory-module/marinara-memory-runtime.cjs
